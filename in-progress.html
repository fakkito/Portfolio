<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress - Achille Dutel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script>
        if (localStorage.getItem('theme') !== 'light') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <header class="top-header">
        <div class="brand"><span class="brand-name">Achille Dutel</span></div>
        <div class="header-tools">
            <a href="index.html#projets" class="tool-btn">
                <i class="fas fa-arrow-left"></i> <span id="txt-back">Back</span>
            </a>
            <div class="divider"></div>
            
            <button class="tool-btn" onclick="window.toggleProjectLanguage()">
                <span class="icon">🌍</span> <span id="txt-lang">FR</span>
            </button>
            
            <button class="tool-btn theme-btn" onclick="window.toggleProjectTheme()" aria-label="Toggle Theme">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <main class="main-content">
        <div class="wip-container">
            <div class="wip-icon">
                <i class="fas fa-hard-hat"></i>
            </div>
            
            <h1 class="wip-title" id="wip-title">Projet en cours de développement</h1>
            
            <p class="wip-text" id="wip-desc">
                Je suis actuellement en train de peaufiner les détails de ce projet.<br>
                La documentation complète sera bientôt disponible ici.
            </p>

            <a href="index.html#projets" class="primary-btn" id="wip-btn">
                Retour aux projets
            </a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content"><p>&copy; 2025 Achille Dutel.</p></div>
    </footer>

    <script>
    (function() {
        // --- 1. DICTIONNAIRE DE TRADUCTION ---
        const projectTranslations = {
            fr: {
                "txt-back": "Retour",
                "txt-lang": "EN",
                "wip-title": "Projet en cours de développement",
                "wip-desc": "Je suis actuellement en train de peaufiner les détails de ce projet.<br>La documentation complète sera bientôt disponible ici.",
                "wip-btn": "Retour aux projets"
            },
            en: {
                "txt-back": "Back",
                "txt-lang": "FR",
                "wip-title": "Project Under Development",
                "wip-desc": "I am currently polishing the details of this project.<br>Full documentation will be available here soon.",
                "wip-btn": "Back to Projects"
            }
        };

        // --- 2. RECUPERATION DE LA LANGUE ET DU THEME ---
        
        let currentLang = localStorage.getItem('lang') || 'en';
        
        let isDark = localStorage.getItem('theme') === 'light' ? false : true;

        // --- 3. FONCTIONS GLOBALES (Accessibles par le HTML) ---
        
        window.toggleProjectTheme = function() {
            isDark = !isDark;
            applyTheme();
        };

        window.toggleProjectLanguage = function() {
            currentLang = currentLang === 'fr' ? 'en' : 'fr';
            localStorage.setItem('lang', currentLang);
            updateProjectTexts();
        };

        window.changeImage = function(element, imageSrc) {
            const mainImg = document.getElementById('mainImage');
            if(!mainImg) return;
            mainImg.style.opacity = '0.8';
            setTimeout(() => { 
                mainImg.src = imageSrc; 
                mainImg.style.opacity = '1'; 
            }, 150);
            document.querySelectorAll('.thumb').forEach(thumb => thumb.classList.remove('active'));
            element.classList.add('active');
        };

        // --- 4. FONCTIONS INTERNES ---

        function applyTheme() {
            const icon = document.getElementById('theme-icon');
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                if(icon) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); }
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                if(icon) { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); }
                localStorage.setItem('theme', 'light');
            }
        }

        function updateProjectTexts() {
            if (typeof projectTranslations === 'undefined') return;

            const texts = projectTranslations[currentLang];
            
            for (const key in texts) {
                const el = document.getElementById(key);
                if (el) el.innerHTML = texts[key];
            }

            const langBtn = document.getElementById('txt-lang');
            if (langBtn) {
                langBtn.innerText = currentLang === 'fr' ? 'EN' : 'FR';
            }
        }

        // --- 5. INITIALISATION ---
        applyTheme();
        updateProjectTexts();

    })();
    </script>
</body>
</html>
